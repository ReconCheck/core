[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconcheck"
version = "0.1.0"
description = "Cross-document verification engine: tell you what doesn't match, by how much, and where in the original file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ReconCheck" }]
keywords = ["document-ai", "reconciliation", "invoice", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
reconcheck = "reconcheck.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/reconcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]