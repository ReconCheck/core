[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reconcheck"
version = "0.1.0"
description = "Cross-document verification engine: tell you what doesn't match, by how much, and where in the original file."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "ReconCheck" }]
keywords = ["document-ai", "reconciliation", "invoice", "verification"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "httpx>=0.27"]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "httpx>=0.27"]
pdf = ["pdfplumber>=0.11"]
# scanned-PDF OCR backend: needs a system Tesseract binary (or RECONCHECK_TESSERACT_CMD)
pdf-ocr = ["pdfplumber>=0.11", "pytesseract>=0.3", "Pillow>=10"]
# encrypt data-source tokens at rest via RECONCHECK_DATA_KEY; without it tokens stay plaintext
crypto = ["cryptography>=42"]

[project.scripts]
reconcheck = "reconcheck.cli:main"
reconcheck-api = "reconcheck.web.app:run"

[tool.hatch.build.targets.wheel]
# hatchling's packages target bundles non-.py files inside the package too
# (web/static UI, rules_defaults), verified in the wheel build — do NOT add a
# force-include for them or they get archived twice
packages = ["src/reconcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]  # B008: FastAPI's Depends/File in defaults is idiomatic